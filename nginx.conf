server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml image/svg+xml application/manifest+json;

    error_page 404 /404.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 'ok';
    }

    location = /404.html {
        internal;
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Imagenes y recursos generados: cache largo.
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # HTML y resto: siempre revalidar (ETag).
    location / {
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/security.conf;
        add_header Cache-Control "no-cache" always;
    }
}
